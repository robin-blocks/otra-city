name: validate plots
# Triggered by a plot changing, and by anything that decides what a POSTER IS —
# the renderer, its framing, and the page it drives. This job is the only one
# that renders posters, so without those paths the pipeline is exercised only
# by somebody else's plot submission, which is a strange way to find out you
# broke it. Posters are content-addressed, so nothing is reshot unless a plot's
# own bytes changed; a renderer-only change costs a readability pass.
# (The list is repeated because GitHub Actions does not expand YAML anchors.)
on:
  pull_request:
    paths:
      - 'public/plots/**'
      - 'scripts/render-posters.mjs'
      - 'lib/poster-paths.mjs'
      - 'public/js/poster-frame.js'
      - 'public/preview.html'
  push:
    branches: [main]
    paths:
      - 'public/plots/**'
      - 'scripts/render-posters.mjs'
      - 'lib/poster-paths.mjs'
      - 'public/js/poster-frame.js'
      - 'public/preview.html'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit lot assignments + street manifest
      pull-requests: write   # auto-merge validated bot submissions
    steps:
      - uses: actions/checkout@v4
        with:
          # check out the PR branch itself (not the detached merge ref) so the
          # lot assignment can be committed onto it before merging
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      # ingest normalization — never serve agent bytes verbatim
      - run: node scripts/normalize-plots.mjs --write

      # Poster stills, rendered from the merged build in the real client. A
      # nice-to-have for directories that thumbnail us, so it must never be
      # what stops an honest plot from landing: on failure the manifest simply
      # publishes poster: null and the step shows up amber. Runners ship Google
      # Chrome; without it the script says so and gives up.
      - name: render plot posters
        continue-on-error: true
        run: node scripts/render-posters.mjs

      # validates every plot AND allocates a lot to any new one (and publishes
      # whatever posters the step above left behind)
      - run: node scripts/validate-all.mjs

      # Commit on the PR branch, not after the merge: a merge performed with
      # GITHUB_TOKEN does not trigger workflows (GitHub's loop guard), so a
      # post-merge job would never run and submitted plots would never be
      # placed on the street.
      - name: commit lot assignments + street manifest
        run: |
          if ! git diff --quiet public/plots/ public/posters/ || \
             [ -n "$(git ls-files --others --exclude-standard public/posters/)" ]; then
            git config user.name otra-city-bot
            git config user.email bot@otra.city
            git add public/plots/ public/posters/
            # A push made with GITHUB_TOKEN never gets a follow-up run (GitHub
            # creates one and fails it with zero jobs), so the merge below
            # happens in THIS run; [skip ci] just suppresses that phantom run.
            git commit -m "chore: assign lot + render posters + rebuild street manifest [skip ci]"
            git push
          else
            echo "no manifest changes"
          fi

      # GitHub merges the CURRENT head, so the manifest commit pushed above is
      # included. The first attempt can race that push ("Base branch was
      # modified"), hence the retries. No --delete-branch: its local-git
      # cleanup fails in this checkout and masks a successful merge, so the
      # outcome is read back from the PR state instead.
      - name: auto-merge bot submissions
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'plot/') &&
          github.event.pull_request.head.repo.full_name == github.repository
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          pr=${{ github.event.pull_request.number }}
          head=${{ github.event.pull_request.head.ref }}
          for attempt in 1 2 3 4; do
            gh pr merge "$pr" --squash || true
            if [ "$(gh pr view "$pr" --json state --jq .state)" = "MERGED" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$head" || true
              echo "merged; branch $head deleted"; exit 0
            fi
            echo "merge attempt $attempt did not land; retrying"; sleep 15
          done
          echo "not merged — leaving the PR open for inspection"; exit 1
