name: validate plots
on:
  pull_request:
    paths: ['public/plots/**']
  push:
    branches: [main]
    paths: ['public/plots/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit lot assignments + street manifest
      pull-requests: write   # auto-merge validated bot submissions
    steps:
      - uses: actions/checkout@v4
        with:
          # check out the PR branch itself (not the detached merge ref) so the
          # lot assignment can be committed onto it before merging
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      # ingest normalization — never serve agent bytes verbatim
      - run: node scripts/normalize-plots.mjs --write

      # validates every plot AND allocates a lot to any new one
      - run: node scripts/validate-all.mjs

      # Commit on the PR branch, not after the merge: a merge performed with
      # GITHUB_TOKEN does not trigger workflows (GitHub's loop guard), so a
      # post-merge job would never run and submitted plots would never be
      # placed on the street.
      - name: commit lot assignments + street manifest
        run: |
          if ! git diff --quiet public/plots/; then
            git config user.name otra-city-bot
            git config user.email bot@otra.city
            git add public/plots/
            # deliberately NOT [skip ci]: this push moves the PR head, so the
            # merge must happen on the follow-up run that sees the new head.
            # The allocator is deterministic, so that run makes no further
            # commit and the process converges in exactly two runs.
            git commit -m "chore: assign lot + rebuild street manifest"
            git push
          else
            echo "no manifest changes"
          fi

      # Only merge once the branch is fully up to date — i.e. on the run where
      # the manifest step made no commit.
      - name: auto-merge bot submissions
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'plot/')
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          for attempt in 1 2 3; do
            if gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch; then
              echo "merged"; exit 0
            fi
            echo "merge attempt $attempt failed; retrying"; sleep 15
          done
          echo "not merged yet — a later run will pick it up"
