# The client check: any change to the served site or to the headless tooling
# it shares with the poster renderer gets the real page loaded in a headless
# Chrome, every lot walked into, the HUD audited on desktop / phone / embed,
# and the frame measured against a draw-call and triangle budget
# (scripts/check-client.mjs). validate-plots.yml only fires on public/plots/**,
# so before this a change to public/js/**, index.html, lib/** or scripts/**
# merged with no check at all beyond "the docs still agree".
#
# Plot submissions are excluded on purpose: a bot PR under plot/* is already
# validated, rendered and merged by validate-plots.yml, and the street check
# would only spend a second runner on every claim.
name: client check
on:
  pull_request:
    paths:
      - 'public/**'
      - '!public/plots/**'
      - '!public/posters/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/client.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '!public/plots/**'
      - '!public/posters/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/client.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # Runners ship Google Chrome; the driver renders through SwiftShader,
      # exactly as the poster step does, so no GPU is assumed.
      - run: node scripts/check-client.mjs --shots shots/client
      # The frames it looked at, pass or fail — a red check with no picture is
      # a guess, and a green one with no picture is a claim.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-check
          path: shots/client
          if-no-files-found: ignore
