<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Broadcast — otra.city</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* The drawing buffer is always 1280 x 720. The canvas is centred and scaled
     down to fit a human's window; a capture reads the buffer, not the CSS. */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { max-width: 100vw; max-height: 100vh; }
  #note {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 6px 10px;
    color: #8a86a0; background: rgba(10, 8, 23, .82); border-top: 1px solid #31234f;
    font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap;
  }
  #note b { color: #2fe0f8; }
  #note.bad { color: #ffb4b4; border-top-color: #7a2b2b; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="note">starting…</div>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.js",
    "three/addons/": "/vendor/three/jsm/"
  }
}
</script>
<script type="module">
// The stadium, live — and the same stadium, filmable.
//
// It runs the client's real pipeline (world, venues, doors, anims, media), so
// what you see is the city visitors walk, not a diorama of it.
//
// The page has TWO modes, and they want opposite things:
//
//   default      a LIVE FEED. Realtime, presence on, a looping cut-list, and
//                every visitor standing in the stadium right now is in shot.
//                Paced by the wall clock, so it is not reproducible — and does
//                not pretend to be. `step()` refuses.
//   ?capture=1   deterministic capture, for RFL's headless harness
//                (docs/broadcast/REPLY.md): fixed timestep, no wall clock, same
//                inputs and seed giving the same pixels. Nothing renders on its
//                own; only `step()` moves time. Three things are left out
//                because each is a determinism bug — presence (visitors arrive
//                over a socket on their own schedule), perfguard (quality that
//                steps down mid-capture changes the pixels), and rAF stepping
//                (a render loop advances the scene off the wall clock).
//
// Live is the default because that is what the URL promises: open /broadcast
// and see the stadium as it is. It is also what makes "go to otra.city and you
// are on the broadcast" true.
//
// The modes are kept far apart on purpose, and the ordering is deliberate.
// Footage from the wrong mode is indistinguishable until the day someone tries
// to re-film it — so the mistake that must never be silent is a capture that
// quietly used live data. It cannot be: `step()` throws in live mode, on the
// first call, naming the flag. The opposite mistake is merely a still frame.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createMediaSystem } from '/js/media.js';
import { createAnimSystem } from '/js/anims.js';
import { loadStreet } from '/js/street.js';
import { loadWorld } from '/js/world.js';
import { buildRoads } from '/js/roads.js';
import { createVenues } from '/js/venues.js';
import { createAfterToneMap } from '/js/after-tonemap.js';
import { createDoorSystem } from '/js/doors.js';
import { createCrowd } from '/js/crowd.js';
import { CAMERAS, createTrack, framePlay, GANTRY_AIM_LAG_S, GANTRY_FOV_LAG_S } from '/js/broadcast-cameras.js';
import { createScorebug } from '/js/scorebug.js';

const FPS = 50;                 // the brief's timebase; one step is 20 ms
const W = 1280, H = 720;        // the brief's frame, fixed regardless of window
// Which build of this page a harness is talking to. Bump the date whenever the
// page's behaviour changes. It is reported in `state().build` and on the note
// line, so "the deployed page still says X" is settled by reading the page,
// not by comparing memories of deploys.
const BUILD = '2026-09-15b';

// Errors are evidence: a silent failure films a black hour, so every one is
// kept for `state()`, echoed to the console the harness reads, and shown.
const errors = [];
const note = document.getElementById('note');
function fail(where, e) {
  const msg = `${where}: ${e && e.message ? e.message : e}`;
  errors.push(msg);
  console.error('broadcast', msg);
  note.classList.add('bad');
  note.textContent = errors.join('\n');
  return msg;
}
addEventListener('error', (e) => fail('page', e.message || e));
addEventListener('unhandledrejection', (e) => fail('unhandled', e.reason?.message || e.reason));
const origError = console.error.bind(console);
console.error = (...a) => { errors.push(a.map(String).join(' ')); origError(...a); };

const params = new URLSearchParams(location.search);
const num = (name, dflt) => { const v = params.get(name); const n = v === null ? NaN : Number(v); return Number.isFinite(n) ? n : dflt; };

// A query parameter must never become code, and this route is public: the
// same rule the venue fixture follows. Bundle URLs are data the SDK fetches
// and must be https (or same-origin, for a local test bundle).
const httpsOnly = (u) => { try { const x = new URL(u, location.href); return x.protocol === 'https:' || x.origin === location.origin ? x.href : null; } catch { return null; } };

const wantVenue = params.get('venue') || 'stadium';
const wantCam = params.get('camera') || 'gantry';
const bundle = params.get('bundle') ? httpsOnly(params.get('bundle')) : null;
if (params.get('bundle') && !bundle) fail('bundle', 'must be an https URL; ignored');
const seed = num('seed', 1);
const t0 = Math.max(0, num('t0', 0));
// The city is the establishing shot, so the plots load by default and
// `?street=0` is the opt-out. It costs about 8 draw calls and 4.7k triangles
// from a wide camera — measured, not assumed — and it is the difference
// between filming otra.city and filming a stadium that happens to sit in it.
const withStreet = params.get('street') !== '0';

// ---- which mode ------------------------------------------------------------
// LIVE IS THE DEFAULT. Opening /broadcast should show the stadium as it is
// right now, with whoever happens to be standing in it — that is what the URL
// promises and what makes "go to otra.city and you are on the broadcast" true.
// Deterministic capture is the specialist mode and has to be asked for.
//
// Getting this round the right way is safe because the two modes fail in
// opposite directions. A capture harness that forgets `capture=1` gets live
// mode, where `step()` throws immediately with a message naming the flag —
// loud, on the first call, before a single frame is filmed. The reverse
// mistake would have been silent: hours of footage that simply never repeats.
const liveParam = params.get('live');
const capture = params.get('capture') === '1' || liveParam === '0';
const live = !capture;
const liveCap = Math.max(1, Math.min(256, Number(liveParam) > 1 ? Number(liveParam) : 32));

// THE LIVE STREAM IS EXACTLY WHAT IS IN THE STADIUM. NOTHING IS ADDED TO IT.
//
// So `crowd` defaults to 0 in BOTH modes, and the live feed shows only real
// visitors. That is not a tuning choice, it is the point of the thing: going
// to otra.city puts you on the broadcast, and the people you can see in the
// stands are people. A synthetic crowd would mean nobody watching — including
// the person standing there — could tell which figures were real, and the one
// promise the stream makes would stop being checkable.
//
// This was already the rule and was already written down; it was overturned
// on 2026-09-15 because the stands looked empty on air, and Robin put it back
// the same day. The stands looking empty is the stream being honest. The fix
// for that is to keep a stand shot SHORT — see live-cutlist.json — not to
// fill the seats.
//
// `?crowd=0.7` still populates them for a harness that wants a full ground to
// measure against; the gate uses it to exercise the instanced crowd's own
// determinism. It is never the default anywhere.
const crowdDensity = params.has('crowd') ? Math.max(0, Math.min(1, num('crowd', 0))) : 0;
const timeofday = params.has('timeofday') ? Math.max(0, Math.min(24, num('timeofday', 0))) : null;
let camtrackUrl = params.get('camtrack') ? httpsOnly(params.get('camtrack')) : null;
if (params.get('camtrack') && !camtrackUrl) fail('camtrack', 'must be an https URL; ignored');
// A live feed with no direction is a frozen frame of an empty pitch, which is
// what /broadcast used to be and why it read as broken. Unless a camera or a
// track is asked for by name, the live feed is directed from here: a looping
// ambient cut-list between matches, and a different one — cuts, no drift —
// while a match is on. Capture mode is never given a default; a harness says
// what it wants, and a named camera or track turns the director off entirely.
const autoDirect = live && !camtrackUrl && !params.get('camera');
const AMBIENT_CUTLIST = '/broadcast/live-cutlist.json';
const MATCH_CUTLIST = '/broadcast/match-cutlist.json';
const PREROLL_CUTLIST = '/broadcast/preroll-cutlist.json';

// Anything the brief names that this build still does not honour is reported
// rather than ignored — a capture that silently got an empty crowd would be
// discovered a week of footage later. The list is empty when everything asked
// for is real, which is the point of keeping it.
const unimplemented = [];

// ---- renderer: the client's pipeline, with the capture's constraints -------
// antialias: false, and not by accident. The frame is composed in the
// composer's targets, which were never multisampled, and the canvas only
// receives the finished quad — so multisampling it bought nothing and cost a
// resolve. It now costs the match: the stage is drawn onto the canvas after
// the output pass against a copy of the scene's depth, and that copy is only
// exact when the canvas has one sample per pixel (js/after-tonemap.js).
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);      // never devicePixelRatio: the buffer must be 1280 x 720 on every machine
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.info.autoReset = false;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0817);
scene.fog = new THREE.Fog(0x0a0817, 32, 95);
const DEFAULT_FOV = 50;   // what a shot that does not state one is filmed at
const camera = new THREE.PerspectiveCamera(DEFAULT_FOV, W / H, 0.1, 220);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x121017, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
scene.add(ground);
const hemi = new THREE.HemisphereLight(0x8899ff, 0x080610, 0.25);
scene.add(hemi);
// The composer is built by after-tonemap.js so that the match can be drawn
// AFTER the output pass rather than through it. The 4DGSX shader writes a
// finished picture; ACES on top of it made the pitch grey-green and lifted,
// which is the broadcast RFL and Robin both saw as washed out. Measured on
// s3-m28 from the gantry, the pitch's light stripe: their own player
// [94,166,96], through the composer [122,182,119].
const after = createAfterToneMap({ renderer, camera });
const composer = after.composer;
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.12, 0.3, 1.0));
composer.addPass(new OutputPass());

const loader = new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('/vendor/three/jsm/libs/draco/gltf/'));
const media = createMediaSystem(camera);
// THIS PAGE IS SILENT, AND SAYS SO.
//
// RFL play the match premix into the audio bus their encoder captures, and
// that bus also carries this browser: anything the page emits is a second
// commentary track laid over the first. Until today silence here was a
// side-effect — no module, therefore no sound — and restoring the match
// module would have ended it without anyone deciding to.
//
// So it is a decision now, made in one place. Muting the listener drops the
// master gain to zero and tells every subscriber, which is how the match
// module's own audio policy learns to keep the publisher's stems off. It
// covers whatever the venue grows next, and `state().silent` lets RFL assert
// it from outside rather than measure it off the bus.
media.setMuted(true);
// ...and stays that way unless the CITY says otherwise. See `wantSound()`.

const anims = createAnimSystem();
const doors = createDoorSystem();

// The streamer and the doors react to a position. There is no player here, so
// the camera's own position stands in: a venue is at Tier 2 because the
// broadcast is inside it.
const viewer = {
  pos: new THREE.Vector3(),
  colliders: [], extra: [], all: [],
  addColliders(list) { this.extra.push(...list); this.all = [...this.colliders, ...this.extra]; },
  removeColliders(list) { const drop = new Set(list); this.extra = this.extra.filter((c) => !drop.has(c)); this.all = [...this.colliders, ...this.extra]; },
};

let def = null, venues = null, V = null, world = null, frame = 0, presence = null;
let crowd = null, track = null, lastTrackCam = null;
// The director's two cut-lists and the one in force. `cutFrom` is the frame a
// list was cut to, so each one restarts at its own first shot instead of
// joining wherever its loop happened to be — the change of programme reads as
// a cut, which is what it is.
let ambientCut = null, matchCut = null, prerollCut = null, cutNow = null, cutFrom = 0;
// Where the live feed started counting, so `state().pace` can say whether
// simulated time is keeping up with the wall. See the comment on the loop.
let livePaceFrom = null;
// A capture that has been up for days is running the page it loaded on the day
// it started. See `watchForNewBuild()`.
const updater = { armed: false, etag: null, changed: false, checks: 0, reloading: false, heldSince: null };
// The big screen's texture: a copy of the frame this page just drew.
let feedTex = null, feedMesh = null;
// The broadcast graphics. Live only: a deterministic capture would have to
// reproduce the clock exactly, and the clock comes off the publisher's stage.
const scorebug = live ? createScorebug({ width: W, height: H }) : null;
const feedStat = { wanted: false, mesh: null, slot: null, attached: false, yielded: false, copies: 0, error: null };

async function boot() {
  const street = withStreet ? await loadStreet(scene) : null;
  world = await loadWorld({ street });
  scene.fog.near = world.presets.fog[0];
  scene.fog.far = world.presets.fog[1];
  camera.far = Math.max(camera.far, world.presets.cameraFar);
  camera.updateProjectionMatrix();
  const roads = buildRoads(scene, world);
  viewer.colliders = [ground, ...(street?.colliders || []), ...roads.colliders];
  viewer.all = [...viewer.colliders];

  def = world.venues.find((v) => v.id === wantVenue);
  if (!def) throw new Error(`no venue "${wantVenue}" in /venues/index.json`);
  def.tiers.unload_after_s = 0;

  // WHAT IS ON IS THE STADIUM'S BUSINESS, NOT THE URL'S.
  //
  // The live feed runs the venue's own match module, unchanged — the same
  // schedule, from the same programme feed, that an ordinary visitor standing
  // in the bowl is watching. A capture that had to be told which bundle to
  // mount could disagree with the city; one that is handed the module cannot,
  // because it is the city. This is the whole of RFL's §1 and it is a filter
  // clause, not a feature: the module was always there, and only this page
  // was throwing it away.
  //
  // Capture mode still strips it. The schedule path polls a programme feed on
  // a 60 s wall clock — network after load, and a clock a harness cannot step
  // — so a deterministic run films the bundle it names or an empty pitch.
  def.modules = (def.modules || []).filter((m) => {
    if (m.type !== 'match-4dgsx') return true;
    if (capture && !bundle) return false;
    if (bundle) m.bundle = bundle;          // a named bundle still wins, in either mode
    // No audio on a broadcast: RFL mixes crowd and commentary themselves, and
    // the venue's PA loads its commentary stem after the match has mounted,
    // without the mount awaiting it. That is a fetch during capture and an
    // <audio> element running off the wall clock — both for a soundtrack
    // nobody records. Dropped rather than muted.
    // The venue's PA goes in every mode. It is a distributed speaker
    // simulation for somebody walking around the bowl — four sources with
    // arrival delays of 180-320 ms — which is exactly wrong for a television
    // mix, and it is a fetch plus an <audio> element on the wall clock.
    // The publisher's own sources stay: placed, and silent until asked for.
    delete m.pa;
    if (capture) { delete m.audio; delete m.now; }
    // The big screen carries the live feed rather than the bundle's recording
    // of the match, so the publisher's `main` dock is not attached to it.
    if (live) m.live_screen = 'main';
    return true;
  });

  venues = createVenues(scene, world, { loader, player: viewer, doors, anims, media, camera, renderer });
  V = venues.get(wantVenue);

  // Park the viewer at the venue's centre so the streamer resolves Tier 2,
  // then hold the venue there for the whole capture.
  const centre = world.toWorld(def, { x: 0, z: 0 });
  viewer.pos.set(centre.x, 0, centre.z);
  V.force = 2;

  if (timeofday !== null) applyTimeOfDay(timeofday);

  // The camera track is loaded before anything is filmed: a segment naming a
  // camera that does not exist should stop the run now, not at frame 90,000.
  if (camtrackUrl) {
    try { track = await loadTrack(camtrackUrl); } catch (e) { track = null; fail('camtrack', e); }
  }
  if (autoDirect) {
    // Both lists are loaded before filming, for the same reason one is: a cut
    // to a camera that does not exist should be found now, not at the first
    // goal of a live match.
    try { ambientCut = await loadTrack(AMBIENT_CUTLIST); } catch (e) { fail('cutlist', e); }
    try { matchCut = await loadTrack(MATCH_CUTLIST); } catch (e) { fail('cutlist', e); }
    try { prerollCut = await loadTrack(PREROLL_CUTLIST); } catch (e) { fail('cutlist', e); }
    cutNow = ambientCut;
  }

  if (crowdDensity > 0) {
    const centre = world.toWorld(def, { x: 0, z: 0 });
    crowd = createCrowd(scene, {
      seats: (def.seats || []).map(([x, y, z]) => { const w = world.toWorld(def, { x, z }); return [w.x, y, w.z]; }),
      density: crowdDensity, seed, facing: [centre.x, centre.z],
    });
    if (!crowd.count) unimplemented.push('crowd — this venue declares no seats, so nobody could be seated');
  }

  useCamera(wantCam);
  advance(1 / FPS);
  await venues.whenLoaded(wantVenue);
  // The streamer creates and activates a venue's modules on the update after
  // the GLB lands, so the match module does not exist until we tick again.
  for (let i = 0; i < 2; i++) advance(1 / FPS);
  // A mounted match is part of "ready". The venue reaches Tier 2 in one tick
  // but the bundle takes seconds of wall time to arrive, and a harness that
  // started stepping at Tier 2 would film an empty pitch until it landed —
  // the failure that is only visible once there is footage.
  if (bundle) await matchMounted();
  await networkQuiet();
  // Let the venue settle: gates, anims and the module's first board. The
  // count is fixed on purpose. Waiting for the mount above happens on the
  // wall clock without advancing anything, because a settle loop that ran
  // "until mounted" would tick a different number of times on a slow network
  // and no two runs would agree.
  for (let i = 0; i < 30; i++) advance(1 / FPS);
  // `t0` is a warm-up, not a seek — the scene is stepped to it.
  const start = Math.round(t0 * FPS);
  while (frame < start) { advance(1 / FPS); frame += 1; }
  if (live) { await startLive(); watchForNewBuild(); }
  draw();
}

/**
 * Join the city as a camera and render in realtime.
 *
 * The reported position is the venue centre, not the camera's: the presence
 * server picks each client's peers by distance from where it says it is, so
 * standing at the centre spot is what makes "the people in this stadium" the
 * ones who appear. `observe` asks the server not to show us to them in return.
 */
async function startLive() {
  const { createPresence } = await import('/js/presence.js');
  livePaceFrom = { wall: performance.now(), sim: simT };
  // presence reports its own facing from the player's avatar; a camera has no
  // body, so it offers the one field that is read and nothing else.
  const asCitizen = { pos: viewer.pos, avatar: { group: { rotation: { y: 0 } } } };
  presence = createPresence(scene, asCitizen, params.get('ws') || undefined,
    { maxRendered: liveCap, observe: true });
  let last = performance.now();
  renderer.setAnimationLoop(() => {
    const now = performance.now();
    // THE CLAMP IS LOAD-BEARING, AND IT COSTS LESS THAN IT LOOKS.
    //
    // It stops one long stall (a background tab, a GC pause, a bundle landing)
    // from advancing the world by a second in a single step. The apparent cost
    // is that a machine which cannot sustain 20 fps does not drop frames — it
    // runs the WORLD slow, permanently.
    //
    // Which matters far less than it reads, and the difference is worth
    // knowing. A LIVE fixture is never told to play: the SDK holds it against
    // the programme's own wall clock, so a slow renderer drops frames and the
    // match stays in real time. Measured on production during m28, with the
    // renderer at pace 0.174: 67 s of wall, 67 s of match clock, 1.000x. Only
    // a REPLAY — anything we mount and `play()` ourselves, including the
    // bundle `now.json` names — advances on this dt, and that is where slow
    // motion comes from (m27: 40 s of match in 418 s of wall).
    //
    // So the clamp stays, and the page reports the ratio — `state().pace` —
    // which a capture should read as "the picture is dropping frames", not
    // "the match is running slow". See docs/broadcast/REPLY-5-ADDENDUM.md.
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    advance(dt);
    presence.update(dt, simT);
    // Frames come from elapsed time, not from how often the browser painted:
    // one rAF is not one frame at 50 fps, and a cut-list keyed to the frame
    // number would run 20% fast on a 60 Hz screen and stall in a background tab.
    frame = Math.round(simT * FPS);
    direct(dt);
    applySound();
    updateFeedScreen();
    draw();
  });
}

/** The match module's own view of itself, or null if the venue has no match. */
function matchState() {
  const v = venues?.state()?.find((x) => x.id === wantVenue);
  return v?.modules?.find((m) => m.type === 'match-4dgsx')?.state ?? null;
}

/**
 * Hold `ready` until the bundle is on the pitch. Polled on the wall clock and
 * deliberately outside the fixed timestep: nothing here advances the scene, so
 * however long the download takes, every run reaches frame 0 in the same state.
 */
async function matchMounted({ timeoutMs = 120000 } = {}) {
  const until = Date.now() + timeoutMs;
  for (;;) {
    const m = matchState();
    if (m?.phase === 'match') return m;
    if (m?.errors?.length) { fail('match', `bundle did not mount: ${m.errors.join('; ')}`); return m; }
    if (Date.now() > until) { fail('match', `bundle did not mount within ${timeoutMs / 1000}s (phase "${m?.phase ?? 'none'}")`); return m; }
    await new Promise((r) => setTimeout(r, 250));
  }
}

/**
 * Shift the lighting toward a time of day.
 *
 * This is a lighting change, not an art pass: otra.city is authored for night,
 * and its emissive signs, floodlights and bloom are the look. Daylight raises
 * the ambient, lifts the sky and pushes fog back, so a match reads as an
 * afternoon fixture — but the neon is still on, because it is painted in.
 */
function applyTimeOfDay(hour) {
  // 0 at midnight, 1 at midday, with dawn and dusk taking about three hours
  const day = Math.max(0, Math.min(1, (Math.cos((hour - 12) / 12 * Math.PI) + 1) / 2));
  const eased = day * day * (3 - 2 * day);
  const night = new THREE.Color(0x0a0817), noon = new THREE.Color(0x9fb2d8);
  const sky = night.clone().lerp(noon, eased * 0.82);
  scene.background = sky;
  if (scene.fog) {
    scene.fog.color = sky;
    scene.fog.far = world.presets.fog[1] * (1 + eased * 0.7);
  }
  hemi.intensity = 0.25 + eased * 1.15;
  renderer.toneMappingExposure = 1.15 - eased * 0.25;
}

/**
 * Point the camera, in venue-local metres. Everything the director produces —
 * built-in shots and RFL's own track files alike — is expressed from the pitch
 * centre with +z toward the north stand, and converted here exactly once.
 */
function aim({ pos, lookAt, fov, roll }) {
  const p = world.toWorld(def, { x: pos[0], z: pos[2] });
  const t = world.toWorld(def, { x: lookAt[0], z: lookAt[2] });
  camera.position.set(p.x, pos[1], p.z);
  camera.lookAt(t.x, lookAt[1], t.z);
  // lookAt can never tilt the horizon — it always levels the camera against
  // its up vector — so roll is applied afterwards, about the view axis.
  if (roll) camera.rotateZ(roll);
  if (fov && fov !== camera.fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
}

// The three §5 shots are motion by definition, so they come from the director
// even though `pitchside` also exists as a static view in venue.json. Every
// other name resolves to the authored camera, `gantry` included: that one is
// RFL's contracted position and the check verifies the authored value.
const ANIMATED = new Set(['heli', 'stands', 'pitchside']);

/**
 * The stadium's big screen, showing the broadcast.
 *
 * A ground's screen carries the television feed. Ours carried a video file out
 * of the match bundle — the right match, correctly, but a recording: nothing
 * that happened in this stadium could ever appear on it, and it was a second
 * video decode for a surface a few hundred pixels wide.
 *
 * This takes the frame we have already drawn. `copyFramebufferToTexture` is a
 * copy on the GPU of the composited canvas — the same pixels the encoder gets,
 * whatever is in them, so anything ever drawn into the frame appears on the
 * screen without this code learning about it. It adds no draw calls and no
 * second pass over the scene, which the obvious implementation (render the
 * world again from a second camera) very much does: a match runs ~292 calls
 * against a budget of 480, and doubling it would have cost the budget rather
 * than bought anything.
 *
 * The screen therefore shows the frame before this one, which is what a real
 * screen does, and it shows itself showing itself — the feed camera can see it.
 * That regress converges to nothing within two or three nestings because the
 * screen is a small part of the frame, so it reads as a screen in shot rather
 * than as a fault.
 */
function findMeshIn(node) {
  let m = null;
  node?.traverse?.((o) => { if (!m && o.isMesh) m = o; });
  return m;
}

function ensureFeed() {
  if (feedTex || !live) return;
  // Whichever node the module reserved, by the name the venue gave it.
  const mod = def?.modules?.find((m) => m.live_screen);
  const nodeName = mod?.docks?.[mod.live_screen];
  feedStat.wanted = !!nodeName;
  feedStat.slot = nodeName || null;
  if (!nodeName) return;
  feedMesh = findMeshIn(V?.nodes?.[nodeName]);
  feedStat.mesh = feedMesh ? (feedMesh.name || '(unnamed)') : null;
  if (!feedMesh) { feedStat.error = `no mesh under "${nodeName}"`; return; }
  // FramebufferTexture, not Texture: three has a separate upload path for a
  // texture that is filled by a copy rather than from an image, and a plain
  // Texture with a made-up `image` hits the wrong one.
  feedTex = new THREE.FramebufferTexture(W, H);
  // NOT SRGBColorSpace, however much the pixels deserve it. Marking it sRGB
  // makes three allocate an SRGB8_ALPHA8 texture, and copyTexSubImage2D from
  // the default framebuffer into one of those is INVALID_OPERATION — which it
  // reports by setting an error flag rather than throwing, so every counter
  // reads healthy and the screen is simply black. Measured: gl error 0x502 on
  // every copy. Left linear, the already-encoded bytes pass through and get
  // encoded once more by the output pass, which lifts the screen slightly.
  // A stadium screen being a little hot is a fair price for one that works.
  feedTex.minFilter = THREE.LinearFilter;
  feedTex.magFilter = THREE.LinearFilter;
  feedTex.generateMipmaps = false;
  // A framebuffer is written bottom-up; every media surface in this city
  // carries glTF UVs, which are not.
  feedTex.flipY = false;
  feedTex.repeat.set(1, -1);
  feedTex.offset.set(0, 1);
}

/** Hand the screen the feed while a match is on, and the plate back when it is not. */
function updateFeedScreen() {
  if (!live) return;
  ensureFeed();
  if (!feedMesh || !feedTex) return;
  const m = matchState();
  const onAir = m?.phase === 'match';
  // THE BUILD-UP AND THE OUTRO BELONG TO THE MODULE, not to the feed. Through
  // those the module has the venue's own card on this screen — who is playing
  // and how long until the whistle — and the director spends four fifths of
  // the pre-roll framing it. Painting the broadcast over it would put a
  // picture of the stadium where the countdown should be, and the two would
  // fight for the material four times a second.
  const own = m?.bug?.preroll === true || (m?.bug?.over === true && m?.bug?.inPlay === false);
  const want = onAir && !own ? feedTex : null;
  // Between matches the module paints its own card here; leave it alone.
  if (want && feedMesh.material.map !== feedTex) { feedMesh.material.map = feedTex; feedMesh.material.needsUpdate = true; }
  feedStat.attached = feedMesh.material.map === feedTex;
  feedStat.yielded = !!own;
}

/**
 * Reload when the page itself changes — but never while a match is on.
 *
 * THIS IS THE ONE THING ABOUT A 24/7 CAPTURE THAT IS NOT OBVIOUS. `now.json`
 * reaches every client within a minute because the module polls it, so what is
 * ON changes without anyone touching the encoder. Page CODE does not. RFL's
 * capture is a headless Chrome that loaded this file once and has been
 * streaming it ever since, which means a deploy reaches the website and not
 * the broadcast — twice now we have shipped something, verified it on
 * production, and watched Twitch carry the old build for hours because nobody
 * thought to restart a process that was working fine.
 *
 * The signal is the document's own ETag: no new file to keep in step with the
 * `BUILD` constant, and nothing to drift. A HEAD costs a few hundred bytes.
 *
 * The rule that makes it safe is that it only fires on an EMPTY PITCH. A
 * stream that blacks out for four seconds between matches is a non-event; one
 * that does it at 2-1 in the second half is a fault, and no deploy is worth
 * that. Capture mode never arms it at all — a harness reloading itself
 * mid-capture would be a determinism bug of the worst kind.
 */
function watchForNewBuild({ everyMs = 5 * 60 * 1000 } = {}) {
  if (!live) return;
  const url = location.pathname;
  const etagOf = async () => {
    try {
      const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      return r.headers.get('etag');
    } catch { return null; }
  };
  etagOf().then((tag) => {
    if (!tag) return;                 // no etag, no signal, no harm
    updater.etag = tag;
    updater.armed = true;
    setInterval(async () => {
      if (updater.reloading) return;
      const now = await etagOf();
      updater.checks += 1;
      if (!now || now === updater.etag) return;
      // How long a change has been waiting. A number nobody reads is how the
      // last one stayed quiet for an hour.
      updater.heldSince ??= Date.now();
      updater.heldS = Math.round((Date.now() - updater.heldSince) / 1000);
      updater.changed = true;
      // WAIT FOR A SEAM, NOT FOR AN EMPTY PITCH.
      //
      // This used to hold until nothing was mounted, which sounded careful and
      // was in fact a condition that can never come true: the stadium runs a
      // looping replay for the twenty-two hours a day that are not a fixture,
      // so a match is ALWAYS mounted and the reload waited for ever. RFL
      // measured ours holding a change across 25 consecutive checks without
      // once acting on it, and had written the identical bug on their side.
      //
      // What actually matters is not interrupting PLAY. Every programme has
      // seams that are not play — the build-up, half time, the outro — and a
      // looping replay passes through them once a cycle, so the reload lands
      // within a loop instead of never. `bug.inPlay` is the publisher's own
      // truth about it — their clock, extended across the seconds between a
      // buzzer and their own "ball at rest" — and it is false in all of them.
      const m = matchState();
      if (m?.phase === 'match' && m?.bug?.inPlay !== false) return;
      updater.reloading = true;
      console.log('/broadcast: the page changed and the pitch is empty — reloading');
      location.reload();
    }, everyMs);
  });
}

/**
 * What the LIVE DIRECTOR does to a shot the cut-list resolved.
 *
 * Only here. A harness that asks for a camera or hands us a track file gets
 * exactly what it asked for — that is what `--camera gantry` and RFL's own
 * `camtrack` mean, and the §3 sightline is proved against the authored
 * gantry, unmoved. Two substitutions, both of them things a gallery does:
 *
 *   GANTRY  pans and zooms to hold the play, from a position that never
 *           moves. A locked wide of two robots in a fourteen-metre frame is
 *           not a broadcast, and this is RFL's own camera rather than our
 *           impression of it — see `framePlay`; the easing is `easeGantry`.
 *
 * That is the only one. A stand shot used to be re-pointed at whichever
 * terrace had people in it, or dropped when none did — machinery that only
 * made sense while the bowl was filled with a synthetic crowd. The stream
 * shows the stadium as it is, so an empty terrace is the truth and the answer
 * is to look at it briefly rather than to redirect the camera or fake the
 * people. See live-cutlist.json.
 */
function directed(c) {
  if (!c || !autoDirect) return c;
  if (c.camera === 'gantry' && gantryAim && gantryFov !== null) {
    // The position never moves — a real gantry pans and zooms from one place,
    // which is the whole point of RFL's camera. Only the aim and the lens,
    // both eased in `easeGantry`, which is the one place that knows how long
    // the frame took; this only spends them.
    return { ...c, lookAt: gantryAim.map((v) => +v.toFixed(3)), fov: +gantryFov.toFixed(3) };
  }
  return c;
}

/** A camera authored in venue.json, by either spelling. Null if there is none. */
function namedCamera(name) {
  const c = def?.cameras?.[name] ?? def?.cameras?.[String(name).toLowerCase()];
  return c ? { pos: c[0], lookAt: c[1], fov: null } : null;
}

/** Read a cut-list and resolve it against both the director's shots and the venue's own. */
async function loadTrack(url) {
  const doc = await (await fetch(url, { credentials: 'omit' })).json();
  return createTrack(doc, {
    named: namedCamera,
    fetchJson: async (u) => {
      const abs = httpsOnly(u);
      if (!abs) throw new Error(`explicit frames must be an https URL: ${u}`);
      return (await fetch(abs, { credentials: 'omit' })).json();
    },
  }).resolve();
}

/**
 * Choose the programme, once per live frame.
 *
 * RFL's §2 asks for cuts rather than drift: their encoder is CBR, and a slow
 * continuous move spends bitrate on every pixel of every frame. So the two
 * cut-lists are different in kind, not just in shot order. Between matches the
 * ambient list flies and pans, because there is nothing to lose and an empty
 * bowl that never moves reads as a broken stream. Once a match is on the pitch
 * the director changes to static cameras and hard cuts, and nothing moves
 * except the match.
 *
 * A goal is the one moment the scoreboard is the picture rather than a prop:
 * the module paints it for four seconds and the director cuts there, the way
 * a gallery would, then cuts back.
 */
let goalCut = false;
// Whether the match module has been asked to run goal holds again from the
// scorer's head. Once, on the live feed only: a capture must not rewind.
let replayArmed = false;

// ---- the director's own memory --------------------------------------------
//
// Every camera in broadcast-cameras.js is a pure function of (frame, seed,
// params), which is what makes a capture repeat. What follows is not: a hold
// that outlasts a whistle and an aim that eases toward the ball both carry
// state from one frame to the next. They are only ever read on the LIVE feed,
// which is not reproducible by construction — a deterministic capture takes
// none of this path — so the state lives here rather than in that module.

// THE BUZZER IS NOT THE END OF THE PLAY. The half-time and full-time whistles
// arrive with the ball still travelling — a shot, a clearance, a save — and
// cutting to the helicopter on the buzzer takes the picture off the one thing
// the viewer is watching.
//
// RFL's own clock answers this (`play_end_t`, "ball at rest") and the module
// reads it, so this is only the FALLBACK, for a bundle that carries no such
// field: hold the wide while the ball is still moving, and give up after
// BALL_SETTLE_S so a bad measurement cannot hold it for ever.
const BALL_STILL_MS = 0.6;      // metres a second; below this the ball has stopped
const BALL_SETTLE_S = 6;        // and this is the longest the wide is held for it
let settleUntil = 0;            // simulated time the hold expires, or 0 for not holding
let wasLive = false;

// The tracking gantry's aim and lens, easing toward what `framePlay` says the
// operator is reaching for. Two first-order lags at RFL's own constants: "a
// camera that snaps looks like a bug, and one that lags looks like a camera
// operator."
let gantryAim = null;
let gantryFov = null;

/**
 * Whether this page should make a sound — decided by the city, not the URL.
 *
 * RFL's §3 asked for silence and asked to be told before it changed, because
 * their capture browser's audio feeds the same bus as their own premix: a page
 * that emits during a live fixture puts two commentary tracks on air. That is
 * still the default and still what a scheduled fixture gets.
 *
 * A replay the city puts on is the other case. RFL cannot premix something
 * they did not schedule and do not know about — they demonstrably do not, the
 * stream was silent through m27 — so for those the sound has to come from
 * here or from nowhere. `now.json` carries the switch, so it is shared state
 * like everything else about what the stadium is showing, and RFL can read it
 * in `state()` rather than discover it.
 *
 * Capture mode is never audible: an <audio> element on the wall clock is a
 * determinism bug whatever it is playing.
 */
function wantSound() {
  if (!live) return false;
  const m = matchState();
  return m?.source === 'now' && m?.now?.audio === true;
}

function direct(dt = 0) {
  if (!autoDirect) return;
  if (live && !replayArmed) {
    const mod = venues?.module?.(wantVenue, 'match-4dgsx');
    if (mod?.replayCam) { mod.replayCam(true); replayArmed = true; }
  }
  const m = matchState();
  const onAir = m?.phase === 'match';
  // RFL's §4: during play, the gantry essentially throughout — two-a-side robot
  // football is small in frame and every cut away costs the viewer the thread.
  // Half time and full time are the natural place for the stands and the
  // aerial, so the intervals get the ambient list back.
  //
  // `inPlay`, not `playing`: the clock stops at the buzzer and the ball does
  // not. Their buzzers carry their own "ball at rest" and the module reads it,
  // so the wide is held across the dead ball by the publisher's measurement.
  const ballLive = onAir && m?.bug?.inPlay !== false;
  // And a hold of our own after that, for a bundle whose clock block carries
  // no `play_end_t` — nothing then distinguishes the buzzer from the end of
  // the play except watching the ball. A ball we cannot measure reads as
  // stopped, so the director behaves exactly as it did before this existed
  // rather than holding the wide on a guess.
  if (ballLive) settleUntil = 0;
  else if (onAir && wasLive) settleUntil = simT + BALL_SETTLE_S;
  wasLive = ballLive;
  const rolling = (m?.ball?.speed ?? 0) > BALL_STILL_MS;
  if (settleUntil && (!rolling || simT >= settleUntil)) settleUntil = 0;
  const inPlay = ballLive || settleUntil > 0;
  // The build-up is neither play nor between matches: the venue's own screens
  // are on the docks, they are carrying the countdown, and that is what the
  // picture should mostly be. See preroll-cutlist.json.
  const preroll = onAir && m?.bug?.preroll === true && !inPlay;
  const want = (inPlay ? matchCut : preroll ? (prerollCut || ambientCut) : ambientCut)
    || ambientCut || matchCut;
  if (want && want !== cutNow) { cutNow = want; cutFrom = frame; }
  goalCut = onAir && m?.board === 'GOAL' && !!namedCamera('scoreboard');
  easeGantry(dt, m);
}

/**
 * Where the gantry is looking and how tight it is, eased toward what
 * `framePlay` says the operator is reaching for.
 *
 * This is the half of RFL's camera that cannot live in broadcast-cameras.js:
 * a lag carries state from one frame to the next, and nothing in that module
 * ever does. The lens is eased more slowly than the aim, which is their
 * choice and a good one — a zoom that answers every clearance pumps, and a
 * pumping wide is worse than a locked one.
 *
 * With no match on the pitch, or a bundle whose bodies did not verify, there
 * is nothing to frame and the shot falls back to the locked gantry.
 */
function easeGantry(dt, m) {
  const want = m?.phase === 'match' ? framePlay(CAMERAS.gantry(0, 0, {}), m?.play || {}) : null;
  if (!want) { gantryAim = null; gantryFov = null; return; }
  if (!gantryAim) { gantryAim = want.aim.slice(); gantryFov = want.fov; return; }
  // Lags in SECONDS, not per frame. RFL's are per frame at a guaranteed 50,
  // which this page is not: it paces itself from the wall clock, and their own
  // capture machine has been measured painting at a sixth of real time. A
  // per-frame constant there would make a third-of-a-second swing take two.
  const ka = 1 - Math.exp(-Math.max(0, dt) / GANTRY_AIM_LAG_S);
  const kf = 1 - Math.exp(-Math.max(0, dt) / GANTRY_FOV_LAG_S);
  for (let i = 0; i < 3; i++) gantryAim[i] += (want.aim[i] - gantryAim[i]) * ka;
  gantryFov += (want.fov - gantryFov) * kf;
}

/** Follow the city's decision about sound. Called on the same tick as the director. */
function applySound() {
  const want = wantSound();
  if (want === media.muted) media.setMuted(!want);
}

function cameraAt(name, frameNo) {
  const key = String(name).toLowerCase();
  const t = frameNo / FPS;
  // THE HEAD CAM. While the module is running a goal again it says where the
  // scorer's head is and where they are looking, every frame, in venue-local
  // metres like every other camera here. It outranks the scoreboard hold —
  // the replay is what a goal cuts to — and, like it, never a harness's own
  // camera or track.
  if (autoDirect && live && !track) {
    const hc = matchState()?.headcam;
    if (hc?.pos && hc?.lookAt) {
      const c = { pos: hc.pos, lookAt: hc.lookAt, fov: hc.fov || DEFAULT_FOV, segment: -1, camera: 'headcam' };
      lastTrackCam = c;
      return c;
    }
  }
  // A goal interrupts the cut-list, not the harness: an explicitly requested
  // track or camera is never overridden by the director.
  if (goalCut && !track) {
    // fov is stated rather than inherited: an authored camera carries none of
    // its own, and cutting here from the ambient orbit (46°) would otherwise
    // film the whole match at the helicopter's framing.
    const c = { ...namedCamera('scoreboard'), fov: DEFAULT_FOV, segment: -1, camera: 'scoreboard' };
    lastTrackCam = c;
    return c;
  }
  // An explicit `?camtrack=` is absolute; the director's lists run from the
  // frame they were cut to, so each starts on its own first shot.
  const cut = track || cutNow;
  if (cut) {
    const c = cut.at(track ? frameNo : frameNo - cutFrom);
    // Past the end of the track the last segment's final framing is held,
    // rather than snapping somewhere arbitrary mid-capture.
    if (c) { const d = track ? c : directed(c); lastTrackCam = d; return d; }
    if (lastTrackCam) return lastTrackCam;
  }
  if (ANIMATED.has(key)) return CAMERAS[key](t, seed, {});
  // Authored names are lower-case in venue.json and RFL's brief writes every
  // camera in capitals, so an authored camera answers to either.
  const c = namedCamera(name);
  if (c) return c;
  if (CAMERAS[key]) return CAMERAS[key](t, seed, {});
  return null;
}

/**
 * Hold `ready` until the page has stopped fetching things.
 *
 * Mounting a match is not the end of its loading: the 4DGSX SDK pulls its dock
 * panels (`ui/lineup.html` and friends) after `mount()` resolves, on the wall
 * clock. Both are one-off, but a slow network can land one on either side of
 * frame 0 — so two runs of the same capture would differ by a panel that is
 * blank in one and populated in the other. Waiting for quiet removes the whole
 * class rather than the one instance we found.
 *
 * Wall-clock, and advances nothing: boot is not part of the deterministic
 * timeline, and every run still reaches frame 0 in the same state.
 */
async function networkQuiet({ stableMs = 1500, timeoutMs = 30000 } = {}) {
  const until = Date.now() + timeoutMs;
  let count = performance.getEntriesByType('resource').length;
  let steadySince = Date.now();
  for (;;) {
    await new Promise((r) => setTimeout(r, 250));
    const now = performance.getEntriesByType('resource').length;
    if (now !== count) { count = now; steadySince = Date.now(); }
    else if (Date.now() - steadySince >= stableMs) return count;
    if (Date.now() > until) {
      fail('network', `still fetching after ${timeoutMs / 1000}s (${count} resources); frames may differ between runs`);
      return count;
    }
  }
}

function useCamera(name) {
  const c = cameraAt(name, frame);
  if (!c) {
    fail('camera', String(name).toLowerCase() === 'track'
      ? 'TRACK is the camera a track file supplies — add camtrack=<https url>'
      : `unknown camera "${name}" — one of ${[...new Set([...Object.keys(def?.cameras || {}), ...Object.keys(CAMERAS)])].join(', ')}`);
    return false;
  }
  aim(c);
  return true;
}

/** One fixed-timestep tick. Every system here takes dt from us; none reads a clock. */
let simT = 0;
function advance(dt) {
  simT += dt;
  doors.update(dt, viewer.pos);
  venues.update(dt, viewer.pos, simT);
  anims.update(dt, simT, viewer.pos);
  media.update(viewer.pos, dt);
}

function draw() {
  // Both of these are pure in (frame, seed): re-drawing frame N gives frame N,
  // and seeking to it gives the same thing as stepping to it.
  const c = cameraAt(wantCam, frame);
  if (c) aim(c);
  if (crowd) crowd.update(frame / FPS);
  renderer.info.reset();
  // The city through the composer, then the match on top of it, with the
  // scene's depth — a player behind the near stand stays behind it.
  after.render(venues?.afterToneMap() ?? []);
  // The graphics go on before the screen takes its copy, so the big screen
  // carries the broadcast as broadcast — scorebug and all — which is what a
  // ground's screen actually shows. It nests, because the feed camera can see
  // the screen; it converges within a nesting or two and reads as a screen in
  // shot.
  if (scorebug) {
    scorebug.draw(matchState()?.bug ?? null);
    scorebug.render(renderer);
  }
  if (feedTex && feedMesh && feedMesh.material.map === feedTex) {
    try {
      renderer.copyFramebufferToTexture(feedTex);
      feedStat.copies += 1;
      // copyTexSubImage2D fails by setting an error flag, not by throwing: a
      // mismatched internal format on the destination is silent, and the
      // symptom is a screen that stays black while every counter says fine.
      if (feedStat.copies <= 3) {
        const gl = renderer.getContext();
        const err = gl.getError();
        if (err) feedStat.error = `gl error 0x${err.toString(16)} on copy`;
      }
    }
    catch (e) { feedStat.error = e.message || String(e); fail('feed', e); feedTex = null; }
  }
  // finish() blocks until the driver has actually drawn: without it `frame()`
  // can read a buffer the GPU has not finished writing.
  renderer.getContext().finish();
  if (!errors.length) {
    const r = renderer.info.render;
    note.textContent = `otra.city broadcast · ${wantVenue} · camera ${wantCam} · frame ${frame} `
      + `(${(frame / FPS).toFixed(2)}s @ ${FPS}fps) · ${W}×${H} · build ${BUILD} · ${r.calls} calls · ${r.triangles} tris`
      + (crowd ? ` · ${crowd.count} fans (${crowd.state.standing} up)` : '')
      + ((track || cutNow) && lastTrackCam ? ` · ${track ? 'track' : cutNow === matchCut ? 'match cut' : 'ambient cut'}`
          + ` seg ${lastTrackCam.segment} (${lastTrackCam.camera})` : '')
      + (live ? ` · LIVE ${presence?.count ?? 0}/${liveCap} peers${presence?.connected ? '' : ' (connecting…)'} — not reproducible` : '')
      + (unimplemented.length ? `\nnot in this build: ${unimplemented.join(' · ')}` : '');
  }
}

const ready = boot().then(() => ({ venue: wantVenue, camera: wantCam, fps: FPS, width: W, height: H, build: BUILD }))
  .catch((e) => { fail('boot', e); throw e; });

window.rflBroadcast = {
  ready,
  fps: FPS, width: W, height: H, build: BUILD,

  /**
   * Advance the scene to absolute frame `n` on the 50 fps timebase and draw it.
   * Resolves once the GPU has finished the frame, so `frame()` is safe after.
   * Time has no inverse here: stepping backwards needs a reload.
   */
  async step(n) {
    await ready;
    if (live) throw new Error('/broadcast is a live feed by default and paces itself from the wall clock. For deterministic capture add ?capture=1 to the URL, which turns off live visitors and hands the clock to step().');
    const target = n === undefined ? frame + 1 : Math.round(n);
    if (target < frame) throw new Error(`step(${target}) is behind the current frame ${frame}; reload with ?t0= to rewind`);
    while (frame < target) { advance(1 / FPS); frame += 1; }
    draw();
    return { frame, t: frame / FPS };
  },

  /** The current frame as a PNG data URL. The drawing buffer is preserved, so this may be called any time after `step()`. */
  frame() { return renderer.domElement.toDataURL('image/png'); },

  /** Raw RGBA for a harness that would rather not decode PNG. Bottom-up, as WebGL reads it. */
  pixels() {
    const gl = renderer.getContext();
    const buf = new Uint8Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    return buf;
  },

  /**
   * Drive the mounted match's clock, in match seconds. Returns where it landed,
   * or null when nothing is mounted. A harness affordance — see the module.
   */
  seekMatch(t) { return venues?.module(wantVenue, 'match-4dgsx')?.seek?.(Number(t)) ?? null; },

  camera: (name) => useCamera(name),
  /** A harness's way to play RFL's schedule: see the module's `rehearseLive`. Live feed only. */
  rehearseLive: (opts) => (live ? (venues?.module?.(wantVenue, 'match-4dgsx')?.rehearseLive?.(opts) ?? null) : null),
  // every name `camera=` accepts: the venue's authored views and the director's shots
  cameras: () => [...new Set([...Object.keys(def?.cameras || {}), ...Object.keys(CAMERAS)])],

  state() {
    const r = renderer.info.render;
    return {
      build: BUILD,
      venue: wantVenue, camera: wantCam, frame, t: frame / FPS, fps: FPS,
      width: W, height: H, pixelRatio: renderer.getPixelRatio(),
      tier: V?.tier ?? null, loaded: !!V?.near,
      bundle, seed, street: withStreet,
      // `cap` is how many peer avatars THIS browser draws — not a limit on
      // joining, and nothing that can turn a camera away. Spelled out because
      // it was read as a connection cap, which would make a busy match a risk
      // to the stream.
      live: live ? { cap: liveCap, capIs: 'peer avatars this browser draws', observer: true,
                     peers: presence?.count ?? 0, connected: !!presence?.connected,
                     deterministic: false } : null,
      crowd: crowd ? { density: crowdDensity, fans: crowd.count, standing: crowd.state.standing,
                       seatsOffered: crowd.state.seatsOffered, cap: crowd.state.cap } : null,
      camtrack: track ? { segments: track.segments.length, lastFrame: track.lastFrame,
                          shot: lastTrackCam ? { camera: lastTrackCam.camera, segment: lastTrackCam.segment } : null } : null,
      timeofday,
      // Simulated seconds per wall second since the live feed started. 1.0 is
      // keeping up; 0.5 is a machine that cannot paint fast enough. A LIVE
      // match still runs in real time under a low pace — the SDK holds it to
      // the programme's clock — so this reads as a rough picture, not a slow
      // match. A replay mounted from `now.json` does run slow: it is played on
      // this dt.
      pace: livePaceFrom
        ? +((simT - livePaceFrom.sim) / Math.max(0.001, (performance.now() - livePaceFrom.wall) / 1000)).toFixed(3)
        : null,
      // Silence is a promise to RFL, so it is reported rather than assumed.
      silent: media.muted,
      // What is on, named well enough that RFL can tell from outside whether
      // the stadium and their encoder are showing the same fixture.
      match: (() => {
        const m = matchState();
        if (!m) return null;
        return {
          phase: m.phase, sdk: m.sdk, source: m.source ?? null,
          id: m.match?.id ?? null, title: m.match?.title ?? null,
          // the resolved bundle base, so nobody has to scrape it off a media
          // element that this page may not have created
          bundleUrl: m.match?.bundleUrl ?? null,
          state: m.stage ?? null, clock: m.clock ?? null, score: m.score ?? null,
          next: m.next ? { id: m.next.bundleId, startsAt: m.next.startsAt } : null,
          // what the city says is on, the sound switch included
          now: m.now ?? null,
          // the channel block behind the screens: its title, its timezone and
          // the slots it plays in, which is what the big screen falls back to
          // when the feed lists no fixture at all
          channel: m.channel ?? null,
          // what `now.json`'s "latest" resolves to today
          latest: m.latestReplay ?? null,
          // how many times a looping replay has been round. Reported because
          // it was not, which made the loop look broken when it was working:
          // the module counted, the page never said.
          loops: m.loops ?? 0,
          layers: m.layers ?? [],
          // the goal being run again, if one is; the head cam, if it has one;
          // the arena boards we dressed; whether the bundle's bodies were
          // reachable; the goals in this match, so a harness can find one
          // how the clock is driven: 'wall' (a live fixture through its
          // programme), 'dt' (a replay), null (the publisher's own)
          drive: m.drive ?? null,
          // where the time between `startsAt` and this picture went, in ms:
          // `seen` (their cache + the core fetch + the SDK's parse), `adopt`
          // (our own unlocked copy of the same bundle), `up` (the total, which
          // is what a stopwatch outside sees) and `docAge` (how stale the
          // programme was when the fixture was first seen live in it)
          mount: m.mount ?? null,
          // the publisher's panels on the venue's screens: which slots, and whether attached
          docks: m.docks ?? [],
          replay: m.replay ?? null,
          headcam: m.headcam ? { player: m.headcam.player, fov: m.headcam.fov } : null,
          replayCam: m.replayCam === true,
          boards: m.boards ?? null,
          bodies: m.bodies ?? null,
          // where the ball is and how fast, in venue-local metres: what the
          // gantry follows and what the buzzer hold waits on
          ball: m.ball ?? null,
          // every robot and the ball, which is what the gantry frames
          play: m.play ?? null,
          goals: m.goals ?? [],
          // halves and buzzers, `play_end_t` included — the publisher's own
          // "ball at rest" after each whistle
          clockPlan: m.clockPlan ?? null,
          // the publisher's canvas sprites, and how many times one's canvas
          // changed size — they re-allocate it themselves (see the module)
          labels: m.labels ?? null,
          // the publisher's glass panels: how many the bundle has, how many
          // are not drawn (all of them, unless the venue asks for them)
          glass: m.glass ?? null,
          // what the module changed on the stage so it renders as 4DGSX's own
          // player does (textures sampled as stored, sprites not tone mapped)
          look: m.look ?? null,
          // what the big screen and the side panels are carrying — between
          // matches that is the programme, not the plates they were painted with
          screens: m.screens ?? null,
          audio: m.audio ?? null, errors: m.errors ?? [],
        };
      })(),
      // the big screen: is it carrying the broadcast, and is the copy running
      feed: live ? { ...feedStat } : null,
      // whether the match was drawn after the tone mapping (roots: 1 with a
      // match mounted) — the difference between their look and a washed one
      afterToneMap: after.state(),
      // whether this page will pick up a new build by itself, and whether it
      // has seen one it is waiting for an empty pitch to take
      updater: live ? { ...updater } : null,
      director: autoDirect
        ? { list: cutNow === matchCut ? 'match' : cutNow === prerollCut ? 'preroll' : 'ambient',
            goal: goalCut,
            shot: lastTrackCam ? lastTrackCam.camera : null,
            // the wide being held past the buzzer while the ball is still going
            settling: settleUntil > 0,
            // where the gantry is looking and how tight it is, so a viewer of
            // the state can tell a tracking wide from a locked one
            gantry: gantryAim ? { aim: gantryAim.map((v) => +v.toFixed(2)), fov: gantryFov === null ? null : +gantryFov.toFixed(2) } : null,
            // the visitors in the bowl, which on the live feed is the whole of
            // the crowd — see the note on `crowdDensity`
            peers: presence?.count ?? 0 }
        : null,
      // the broadcast graphics: what they are showing, or null when there is
      // nothing to show
      scorebug: live ? (matchState()?.bug ?? null) : null,
      // the crests behind the scorebug: the manifest, and how many images landed
      crests: live && scorebug?.crests ? scorebug.crests : null,
      calls: r.calls, tris: r.triangles,
      unimplemented, errors: errors.slice(),
    };
  },
  errors,
  // escape hatches for a harness that needs to look closer
  three: { scene, camera, renderer, composer },
};
</script>
</body>
</html>
