# Presence server host config. Deploy with:
#   fly launch --no-deploy --copy-config --name otra-city-presence
#   fly deploy
# Then point the client at it: https://otra.city/?ws=wss://otra-city-presence.fly.dev
# (or hardcode the URL in public/js/presence.js once you're happy with it)
app = "otra-city-presence"
primary_region = "lhr"

[build]
  builder = "heroku/buildpacks:20"

[processes]
  app = "node server/presence.mjs"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
