# otra.city presence server (multiplayer avatars).
#
# One-time setup:
#   fly auth login
#   fly launch --no-deploy --copy-config --name otra-city-presence --region lhr
#   fly deploy
#
# The city works fine without this — the client falls back to solo play if the
# server is unreachable, so deploying (or not) is never load-bearing.
app = "otra-city-presence"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  # WebSockets keep a machine "busy" while anyone is in the city, so it only
  # stops once the street is empty — you pay for presence, not for uptime.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
